[project]
name = "auto-grants-integrated"
version = "0.1.0"
description = "Civic Grant Intelligence Platform"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "markdownify>=0.14.0",
  "lxml>=5.0.0",
  "pydantic>=2.0",
  "feedparser>=6.0",
  "crawl4ai>=0.4.0",
  "psycopg[binary]>=3.3.4",
  "python-dotenv>=1.2.2",
  "sentence-transformers>=3.4.0",
  "tokenizers>=0.22.0,<=0.23.0",
  "sentencepiece>=0.2.0",
  "fugashi>=1.3.0",
  "unidic-lite>=1.0.8",
  "pymupdf>=1.28.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
